<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Your Appointment</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --ink: #12182b; --muted: #5b6479;
    --line: #dde3ee; --brand: #2563eb; --brand-ink: #fff;
    --ok-bg: #e7f6ed; --ok-ink: #10643a; --err-bg: #fdeaea; --err-ink: #97231f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1220; --card: #171d2e; --ink: #f0f3fa; --muted: #98a2b8;
      --line: #2b344a; --brand: #4f86f7; --brand-ink: #08101f;
      --ok-bg: #10321f; --ok-ink: #7fe0a6; --err-bg: #3a1917; --err-ink: #ffada6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--card); width: 100%; max-width: 460px; padding: 32px;
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 32px rgb(16 24 44 / 8%);
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: .92rem; }
  label { display: block; margin-bottom: 6px; font-size: .84rem; font-weight: 600; }
  input, textarea {
    width: 100%; padding: 10px 12px; margin-bottom: 16px; font: inherit;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  textarea { resize: vertical; min-height: 72px; }
  button {
    width: 100%; padding: 12px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--brand-ink); background: var(--brand); border: 0; border-radius: 8px;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: progress; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: .9rem; display: none; }
  #status.show { display: block; }
  #status.ok { background: var(--ok-bg); color: var(--ok-ink); }
  #status.err { background: var(--err-bg); color: var(--err-ink); }
  .foot { margin-top: 20px; text-align: center; font-size: .84rem; }
  .foot a { color: var(--brand); }
</style>
</head>
<body>
  <main class="card">
    <h1>Schedule Your Appointment</h1>
    <p class="sub">Tell us how to reach you and we'll confirm your slot.</p>

    <form id="leadForm" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 555-5555" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

      <label for="date">Preferred date</label>
      <input id="date" name="date" type="date">

      <label for="notes">Notes <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="notes" name="notes" placeholder="Anything we should know?"></textarea>

      <button id="submitBtn" type="submit">Request Appointment</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="foot"><a href="/crm.html">Open CRM &rarr;</a></p>
  </main>

<script>
  // Which business this booking page files leads under (a workspace slug in the CRM).
  // Change per site, or leave '' to use the first workspace.
  const WORKSPACE_SLUG = '';

  const form = document.getElementById('leadForm');
  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  function show(kind, msg) {
    statusEl.textContent = msg;
    statusEl.className = 'show ' + kind;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const payload = {
      name: form.name.value.trim(),
      phone: form.phone.value.trim(),
      email: form.email.value.trim(),
      date: form.date.value || null,
      notes: form.notes.value.trim(),
      source: 'web',
      workspace: WORKSPACE_SLUG
    };

    if (!payload.name || !payload.phone || !payload.email) {
      show('err', 'Please fill in your name, phone, and email.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const res = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const body = await res.json().catch(() => ({}));

      if (res.ok) {
        show('ok', "Thanks! We've got your request and will confirm shortly.");
        form.reset();
      } else if (res.status === 422) {
        const detail = Array.isArray(body.detail) && body.detail.length
          ? body.detail[0].msg
          : 'Please check your details and try again.';
        show('err', detail);
      } else {
        show('err', body.message || 'Something went wrong. Please try again or call us.');
      }
    } catch (err) {
      show('err', 'Network error - please check your connection and try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Request Appointment';
    }
  });
</script>
</body>
</html>
